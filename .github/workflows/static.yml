# Simple workflow for deploying static content to GitHub Pages
name: Deploy static content to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# peaceiris/actions-gh-pages pushes directly to the gh-pages branch via git,
# so the token needs contents:write (pages/id-token were only needed by the
# old actions/deploy-pages-based workflow this replaced).
permissions:
  contents: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Single deploy job since we're just deploying
  deploy:
    # No `environment:` here: the repo's "github-pages" environment has a
    # deployment branch policy that only allows the "gh-pages" branch, but this
    # job runs on pushes to "main" — with the environment attached, GitHub
    # rejects the job before it even starts (0 steps, instant failure). That
    # protection is only relevant to the OIDC-based actions/deploy-pages flow;
    # peaceiris/actions-gh-pages just does a plain git push and doesn't need it.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./src
          publish_branch: gh-pages
          user_name: github-actions
          user_email: github-actions@github.com
